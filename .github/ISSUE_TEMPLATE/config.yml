# Issue forms live beside this file. Blank issues stay enabled on purpose: a
# question forced through a bug form arrives with several empty required fields.
blank_issues_enabled: true

contact_links:
  - name: Report a vulnerability (private)
    url: https://github.com/AltiooBV/altioo-oauth-server/security/advisories/new
    about: >-
      Never a public issue. Acknowledged within 5 working days; SECURITY.md has the
      full commitment and what is out of scope.
  - name: What the extension is and is not
    url: https://github.com/AltiooBV/altioo-oauth-server#readme
    about: >-
      Read before a feature request: it is an authorization server for iTop, not an
      OAuth client and not an identity provider.
